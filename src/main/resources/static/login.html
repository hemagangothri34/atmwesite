<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATM Terminal - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="login-wrapper">
    <div class="login-card-box">
        <div style="display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 20px;">
            <div class="brand-logo">₹</div>
            <h2 style="color: var(--text-heading); margin: 0; font-size: 24px;">ATM <span style="color: var(--green-primary);">Terminal</span></h2>
        </div>
        
        <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 20px;">Please insert your card details to access the ATM terminal</p>

        <div class="form-group" style="text-align: left;">
            <label for="cardNumber">Debit Card Number</label>
            <input type="text" id="cardNumber" placeholder="e.g. 1234567890" maxlength="16" required autocomplete="off">
        </div>

        <div class="form-group" style="text-align: left;">
            <label for="pin">ATM PIN (4-Digits)</label>
            <input type="password" id="pin" placeholder="••••" maxlength="6" required autocomplete="off">
        </div>

        <button class="btn-action-green" onclick="login()" style="margin-top: 10px;">🔐 Insert Card & Login</button>

        <div class="demo-account-pills">
            <div class="demo-title">⚡ Quick Demo Accounts (Click to Autofill)</div>
            <div class="demo-pill" onclick="autofillDemo('1234567890', '1234')">
                <strong>Hema Gangothri</strong> (Card: <code>1234567890</code> | PIN: <code>1234</code>)
            </div>
            <div class="demo-pill" onclick="autofillDemo('9876543210', '4321')">
                <strong>Manikanta Mattaparth</strong> (Card: <code>9876543210</code> | PIN: <code>4321</code>)
            </div>
        </div>
    </div>
</div>

<div id="toast" class="toast-msg"></div>

<script src="atm.js"></script>
<script>
    function autofillDemo(card, pin) {
        document.getElementById("cardNumber").value = card;
        document.getElementById("pin").value = pin;
        showToast("Autofilled credentials for card " + card);
    }
</script>

</body>
</html>
